on: [push, pull_request, workflow_dispatch]

name: CI

env:
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt
      - run: rustc -vV
      - uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: clippy
      - run: rustc -vV
      - uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --workspace --all-targets -- -D warnings

  test_nix:
    name: Test Suite (Unix)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        #- os: ubuntu-latest
        #  TARGET: arm-unknown-linux-musleabihf

        #- os: ubuntu-latest
        #  TARGET: armv7-unknown-linux-musleabihf

        #- os: ubuntu-latest
        #  TARGET: x86_64-unknown-linux-musl

        - os: macos-15
          TARGET: aarch64-apple-darwin

        #- os: macos-15-intel
        #  TARGET: x86_64-apple-darwin

    steps:
      - name: Testing ${{ matrix.TARGET }}
        run: echo "${{ matrix.TARGET }}"

      - uses: amitie10g/install-package@v1
        with:
          brew: mpv
          apt: libmpv-dev

      - run: ls -lR /opt/homebrew/Cellar/mpv/0.40.0_4
      - run: ls -l /opt/homebrew/Cellar/mpv/0.40.0_4/lib

      - uses: actions/checkout@v4

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.TARGET }}
          override: true
      - run: rustc -vV

      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --workspace

